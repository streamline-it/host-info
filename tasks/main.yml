- name: ensure the facts.d directory exists
  ansible.builtin.file:
    path: "{{ host_info_facts_directory }}"
    owner: root
    group: "{{ host_info_root_group }}"
    state: directory

- name: ensure the host information exists in a custom .fact file
  ansible.builtin.template:
    src: "{{ host_info_fact_filename }}.j2"
    dest: "{{ host_info_facts_directory }}/{{ host_info_fact_filename }}"

- name: ensure the host information exists in a custom text file
  ansible.builtin.template:
    src: "{{ host_info_text_filename }}.j2"
    dest: "{{ host_info_text_directory }}/{{ host_info_text_filename }}"
